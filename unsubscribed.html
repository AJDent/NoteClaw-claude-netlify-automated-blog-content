<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>You've Been Unsubscribed | Take Notes Capital</title>
  <meta name="description" content="You've been unsubscribed from Take Notes Capital emails.">
  <style>
    :root {
      --bg:#0A0E1A; --card:#111827; --text:#F5F7FB; --muted:#A8B3C7; --accent:#5ba4e6; --border:#22304A;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
    .wrap { max-width:640px; margin:0 auto; padding:48px 20px 80px; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
    a { color:var(--accent); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:44px 36px; text-align:center; }
    .logo { height:52px; width:auto; display:block; margin:0 auto 24px; }
    .check { width:60px; height:60px; margin:0 auto 22px; border-radius:50%; background:rgba(91,164,230,.12); border:1px solid rgba(91,164,230,.4); display:flex; align-items:center; justify-content:center; }
    .check svg { width:28px; height:28px; }
    h1 { margin:0 0 12px; font-size:26px; line-height:1.2; }
    p.lead { color:var(--text); margin:0; font-size:16.5px; }
    .foot { margin-top:32px; padding-top:20px; border-top:1px solid var(--border); color:#6b7397; font-size:12.5px; line-height:1.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="logo" src="logo.png" alt="Take Notes Capital">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#5ba4e6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1>You've been unsubscribed</h1>
      <p class="lead">You're all set &mdash; you won't receive any more emails from us.</p>
      <div class="foot">
        Take Notes Capital<br>
        30 N Gould St Ste R, Sheridan, WY 82801
      </div>
    </div>
  </div>
</body>
</html>
