name: Friday Publish (blog cadence)

# Publishes the next PRE-APPROVED post from queue/ every Friday.
# Two crons (DST coverage) give two shots; the gate publishes on the FIRST Friday
# run that lands and dedups the rest, so a delayed GitHub cron still ships that day.
# Manual runs (workflow_dispatch) skip the gate so you can publish on demand.

on:
  schedule:
    - cron: '0 14 * * 5'   # ~10:00 ET during EDT (Mar–Nov)
    - cron: '0 15 * * 5'   # ~10:00 ET during EST (Nov–Mar)
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize the two DST crons so the dedup check below can't be raced.
concurrency:
  group: friday-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the "already published today" dedup is reliable

      - name: Gate (Friday, once/day, delay-tolerant)
        id: gate
        run: |
          DOW=$(TZ=America/New_York date +%u)    # 1=Mon … 5=Fri
          TODAY=$(TZ=America/New_York date +%F)   # e.g. 2026-08-28 (ET)
          echo "Eastern day-of-week: $DOW  date: $TODAY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."; echo "go=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$DOW" != "5" ]; then
            echo "Not Friday ET (cron landed off-day) — skipping."; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git log --since="$TODAY 00:00" --grep="Auto-publish (Friday cadence)" --format=%H | grep -q .; then
            echo "A cadence post already published today — skipping (dedup)."; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Friday, nothing published yet today — proceeding."; echo "go=1" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: '3.12'

      - name: Publish next queued post
        id: pub
        if: steps.gate.outputs.go == '1'
        run: python3 queue/publish_next.py

      - name: Commit & push (triggers Netlify deploy)
        if: steps.gate.outputs.go == '1'
        env:
          PUBLISHED: ${{ steps.pub.outputs.published || 'post' }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes (queue empty) — nothing to publish."
            exit 0
          fi
          git config user.name "tnc-cadence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Auto-publish (Friday cadence): $PUBLISHED"
          git push
